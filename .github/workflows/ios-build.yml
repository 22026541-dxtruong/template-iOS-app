name: iOS Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    name: Build MyApp
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      PROJECT_PATH: ios/MyApp.xcodeproj
      SCHEME: MyApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "Missing GitHub Actions secret: FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64"
            exit 1
          fi

          printf '%s' "$FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64" \
            | base64 -D > ios/MyApp/GoogleService-Info.plist

          test -s ios/MyApp/GoogleService-Info.plist

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/MyApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA
        run: |
          mkdir -p build/ipa/Payload

          cp -R \
            build/MyApp.xcarchive/Products/Applications/MyApp.app \
            build/ipa/Payload/MyApp.app

          cd build/ipa
          zip -r MyApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-ipa
          path: build/ipa/MyApp.ipa